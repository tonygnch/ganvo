<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116" width="100" height="116" role="img" aria-label="Sankevi">
  <title>Sankevi</title>
  <!--
    The S read as a stack of sawn boards, transcribed from the chosen concept
    rather than redrawn: ten slats, tapered at top and bottom so the silhouette
    is an oval rather than a block, and two SPLIT rows where a left and a right
    board sit either side of a gap — that gap is what opens the letter's bowls
    and is the thing that makes the mark read as an S instead of a stack.

    Geometry is exact 180° rotational symmetry, which an S has: row i mirrors
    row 9-i. The reference approximated it by a few units; resolving it makes
    the mark sit still.

    Transparent, no plate — the concept had none. Two colourways ship: this one
    the cream colourway, for the dark bark ground; mark.svg is the walnut master. One moss board in the stack.
  -->
  <g fill="#efe7d8">
    <rect x="18" y="2.75"   width="64" height="7" rx="1.2"/>
    <rect x="4"  y="14.25"  width="92" height="7" rx="1.2"/>
    <rect x="0"  y="25.75"  width="34" height="7" rx="1.2"/>
    <rect x="66" y="25.75"  width="34" height="7" rx="1.2"/>
    <rect x="0"  y="37.25"  width="34" height="7" rx="1.2"/>
    <rect x="4"  y="48.75"  width="78" height="7" rx="1.2"/>
    <rect x="18" y="60.25"  width="78" height="7" rx="1.2"/>
    <rect x="0"  y="83.25"  width="34" height="7" rx="1.2"/>
    <rect x="66" y="83.25"  width="34" height="7" rx="1.2"/>
    <rect x="4"  y="94.75"  width="92" height="7" rx="1.2"/>
    <rect x="18" y="106.25" width="64" height="7" rx="1.2"/>
  </g>
  <rect x="66" y="71.75" width="34" height="7" rx="1.2" fill="#7d8f4e"/>
</svg>
