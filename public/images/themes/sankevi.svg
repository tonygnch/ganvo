<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Sankevi theme preview">
  <defs>
    <linearGradient id="sMist" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#5b6552"/>
      <stop offset="0.55" stop-color="#3a4034"/>
      <stop offset="1" stop-color="#20211a"/>
    </linearGradient>
    <linearGradient id="sScrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15120d" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#15120d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sBoard" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2b251a"/>
      <stop offset="1" stop-color="#191510"/>
    </linearGradient>
  </defs>

  <!-- damp-bark ground -->
  <rect width="400" height="300" fill="#15120d"/>
  <!-- bark grain -->
  <g stroke="#f6efe0" stroke-width="1" opacity="0.03">
    <line x1="34" y1="0" x2="34" y2="300"/><line x1="88" y1="0" x2="88" y2="300"/>
    <line x1="152" y1="0" x2="152" y2="300"/><line x1="214" y1="0" x2="214" y2="300"/>
    <line x1="268" y1="0" x2="268" y2="300"/><line x1="336" y1="0" x2="336" y2="300"/>
  </g>

  <!-- announcement band, moss -->
  <rect x="0" y="0" width="400" height="11" fill="#3e4e36"/>
  <g fill="#9dae86" opacity="0.9">
    <rect x="150" y="4" width="16" height="3"/><rect x="234" y="4" width="16" height="3"/>
  </g>
  <g fill="#f1ebdd" opacity="0.55">
    <rect x="60" y="4" width="80" height="3"/><rect x="176" y="4" width="50" height="3"/><rect x="260" y="4" width="80" height="3"/>
  </g>

  <!-- header -->
  <line x1="0" y1="46" x2="400" y2="46" stroke="#332c21" stroke-width="1"/>
  <circle cx="22" cy="29" r="6" fill="none" stroke="#9dae86" stroke-width="1.5"/>
  <path d="M19 32c2-4 6-1 6-5" fill="none" stroke="#9dae86" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="34" y="25" width="56" height="8" fill="#f1ebdd"/>
  <g fill="#8a806d">
    <rect x="112" y="27" width="26" height="4"/><rect x="148" y="27" width="34" height="4"/><rect x="192" y="27" width="30" height="4"/>
  </g>
  <g fill="#b3aa97">
    <rect x="286" y="27" width="16" height="4"/><rect x="312" y="27" width="22" height="4"/>
  </g>
  <rect x="344" y="27" width="28" height="4" fill="#f1ebdd"/>
  <rect x="376" y="27" width="8" height="4" fill="#9dae86"/>

  <!-- hero photograph: the planed corner, cut top-left and bottom-right -->
  <path d="M166 64 H384 V174 L368 190 H150 V80 Z" fill="url(#sMist)"/>
  <!-- pines standing in the mist -->
  <g stroke="#20241c" stroke-width="3" opacity="0.5">
    <line x1="188" y1="72" x2="184" y2="190"/><line x1="232" y1="66" x2="228" y2="190"/>
    <line x1="286" y1="70" x2="282" y2="190"/><line x1="330" y1="64" x2="327" y2="190"/>
    <line x1="366" y1="72" x2="363" y2="190"/>
  </g>
  <g stroke="#7d8a71" stroke-width="1.5" opacity="0.3">
    <line x1="208" y1="64" x2="205" y2="190"/><line x1="262" y1="64" x2="259" y2="190"/><line x1="348" y1="64" x2="345" y2="190"/>
  </g>
  <!-- the scrim the headline crosses -->
  <path d="M166 64 H300 V190 H150 V80 Z" fill="url(#sScrim)"/>

  <!-- gutter index, stood on its end in the margin -->
  <g opacity="0.8">
    <rect x="7" y="70" width="3" height="3" fill="#9dae86"/>
    <line x1="8.5" y1="80" x2="8.5" y2="132" stroke="#473e2f" stroke-width="1"/>
  </g>

  <!-- headline, walking over the photograph -->
  <rect x="20" y="76" width="196" height="18" fill="#f1ebdd"/>
  <rect x="20" y="100" width="150" height="18" fill="#f1ebdd"/>
  <rect x="20" y="124" width="112" height="18" fill="#9dae86"/>
  <g fill="#b3aa97" opacity="0.7">
    <rect x="20" y="154" width="128" height="5"/><rect x="20" y="165" width="104" height="5"/>
  </g>
  <!-- buttons: filled with the corner cut, and its hairline sibling -->
  <path d="M27 184 H94 V204 L87 211 H20 V191 Z" fill="#9dae86"/>
  <path d="M109 184 H176 V204 L169 211 H102 V191 Z" fill="none" stroke="#473e2f" stroke-width="1.5"/>

  <!-- the spec plate hung off the slab's foot -->
  <path d="M274 196 H384 V220 L376 228 H266 V204 Z" fill="#1d1912" stroke="#473e2f" stroke-width="1"/>
  <circle cx="284" cy="212" r="7" fill="none" stroke="#9dae86" stroke-width="1.2"/>
  <g fill="#f1ebdd"><rect x="299" y="205" width="58" height="6"/></g>
  <g fill="#8a806d"><rect x="299" y="216" width="72" height="4"/></g>

  <!-- ledger rule -->
  <line x1="16" y1="240" x2="384" y2="240" stroke="#332c21" stroke-width="1"/>
  <g fill="#f1ebdd">
    <rect x="16" y="228" width="20" height="7"/><rect x="108" y="228" width="26" height="7"/>
    <rect x="200" y="228" width="22" height="7"/><rect x="292" y="228" width="28" height="7"/>
  </g>

  <!-- plates: three cards, each photograph cut at the corner -->
  <g>
    <path d="M25 252 H104 V282 L97 289 H18 V259 Z" fill="url(#sBoard)"/>
    <rect x="18" y="293" width="46" height="5" fill="#f1ebdd"/>
    <path d="M121 252 H200 V282 L193 289 H114 V259 Z" fill="url(#sBoard)"/>
    <rect x="114" y="293" width="52" height="5" fill="#f1ebdd"/>
    <path d="M217 252 H296 V282 L289 289 H210 V259 Z" fill="url(#sBoard)"/>
    <rect x="210" y="293" width="40" height="5" fill="#f1ebdd"/>
    <path d="M313 252 H392 V282 L385 289 H306 V259 Z" fill="url(#sBoard)" opacity="0.7"/>
    <rect x="306" y="293" width="48" height="5" fill="#f1ebdd" opacity="0.7"/>
  </g>
  <!-- sheet numbers, in the lichen -->
  <g fill="#9dae86">
    <rect x="18" y="245" width="12" height="3"/><rect x="114" y="245" width="12" height="3"/>
    <rect x="210" y="245" width="12" height="3"/><rect x="306" y="245" width="12" height="3" opacity="0.7"/>
  </g>
</svg>
